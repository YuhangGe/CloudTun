[package]
name = "cloudtun-server"
version = "0.1.0"
edition = "2024"

[dependencies]
cloudtun-common = { path = "../src-common", features = ["tencent"] }
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
futures-util = "0.3.32"
headers = "0.4.1"
tokio = { version = "1.52.0", features = ["full"] }
tokio-tungstenite = "0.29.0"
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0.102"
