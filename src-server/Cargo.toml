[package]
name = "cloudtun-server"
version = "0.1.0"
edition = "2024"

[dependencies]
cloudtun-common = { path = "../src-common", features = ["tencent"] }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["full"] }
clap = { version = "4.6.8", features = ["derive"] }
anyhow = "1.0.104"

[dev-dependencies]
cloudtun-common = { path = "../src-common", features = ["proxy"] }
