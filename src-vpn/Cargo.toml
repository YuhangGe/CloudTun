[package]
name = "cloudtunvpn"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "cloudtunvpn-test"
path = "src/bin/test.rs"
required-features = ["bin"]

[features]
bin = ["ctrlc2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cloudtun-proxy = { path = "../src-proxy" }
cloudtun-common = { path = "../src-common", features = ["proxy", "ping"] }
tun = { version = "0.8.15", features = ["async"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
ipstack = { version = "1.0.1" }
hashlink = "0.12.2"
tproxy-config = "7.0.10"
hickory-proto = "0.26.3"
async-trait = "0.1.92"
udp-stream = { version = "0.0.13", default-features = false }
anyhow = "1.0.104"
log = "0.4.35"
ctrlc2 = { "version" = "4.0.2", features = ["async"], optional = true }


[target.'cfg(target_os="android")'.dependencies]
android_logger = "0.15.1"
jni = { version = "0.22.4", default-features = false }

[dev-dependencies]
base64 = "0.23.1"
