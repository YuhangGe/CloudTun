[package]
name = "cloudtun-common"
version = "0.1.0"
edition = "2024"

[features]
tencent = ["serde", "reqwest", "anyhow"]
proxy = ["tokio", "tokio-tungstenite", "tokio-util", "futures-util", "http", "tls"]
tls = ["tokio", "tokio-rustls", "serde", "serde_json"]
ping = ["proxy"]

[dependencies]
chrono = "0.4.45"
hmac = "0.13.0"
sha2 = "0.11.1"

# for tencent feature
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "rustls",
], optional = true }

serde = { version = "1.0.229", features = ["derive"], optional = true }
anyhow = { version = "1.0.104", optional = true }

# for proxy feature
tokio = { version = "1.54.1", features = ["full"], optional = true }
tokio-tungstenite = { version = "0.30.0", optional = true }
tokio-util = { version = "0.7.20", optional = true }
# rand = { version = "0.9.2", optional = true }
http = { version = "1.5.0", optional = true }
futures-util = { version = "0.3.34", optional = true }
hex = "0.4.3"


tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
