[package]
name = "cloudtun-common"
version = "0.1.0"
edition = "2024"

[features]
tencent = ["serde", "reqwest", "anyhow"]
proxy = ["tokio", "tokio-tungstenite", "tokio-util", "futures-util", "http"]
ping = ["tokio", "reqwest", "http"]

[dependencies]
chrono = "0.4.44"
hmac = "0.13.0-rc.6"
sha2 = "0.11.0"

# for tencent feature
reqwest = { version = "0.13.2", default-features = false, features = ["json"], optional = true }

serde = { version = "1.0.228", features = ["derive"], optional = true }
anyhow = { version = "1.0.102", optional = true }

# for proxy feature
tokio = { version = "1.50.0", features = ["full"], optional = true }
tokio-tungstenite = { version = "0.29.0", optional = true }
tokio-util = { version = "0.7.18", optional = true }
# rand = { version = "0.9.2", optional = true }
http = { version = "1.4.0", optional = true }
futures-util = { version = "0.3.32", optional = true }
hex = "0.4.3"
