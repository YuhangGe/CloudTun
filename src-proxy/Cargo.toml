[package]
name = "cloudtun-proxy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cloudtun"
path = "src/bin/client.rs"
required-features = ["bin"]

[features]
bin = ["clap", "ctrlc2", "cloudtun-common/ping"]

[dependencies]
cloudtun-common = { path = "../src-common", features = ["proxy"] }
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
hyper = { version = "1.12.0", features = ["full"] }
hyper-util = "0.1.21"

ctrlc2 = { version = "4.0.2", features = ["async"], optional = true }
clap = { version = "4.6.8", features = ["derive"], optional = true }
