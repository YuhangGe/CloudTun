[package]
name = "cloudtun-proxy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cloudtun"
path = "src/bin/client.rs"
required-features = ["bin"]

[features]
bin = ["clap", "ctrlc2", "cloudtun-common/ping"]

[dependencies]
cloudtun-common = { path = "../src-common", features = ["proxy"] }
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
hyper = { version = "1.12.0", features = ["full"] }
hyper-util = "0.1.21"
leaf = { git = "https://github.com/eycorsican/leaf.git", rev = "5e8d94759ce983eb8ac226c315024b55ff2bb7b0", default-features = false, features = ["outbound-vmess", "outbound-ws", "ring-aead", "config-json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
sha2 = "0.11.1"
uuid = "1"
url = "2"
percent-encoding = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3"
ipnet = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
anyhow = "1"

ctrlc2 = { version = "4.0.2", features = ["async"], optional = true }
clap = { version = "4.6.8", features = ["derive", "env"], optional = true }
