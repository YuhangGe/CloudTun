[package]
name = "cloudtun"
version = "0.1.0"
description = "Cloud-based Proxy Solution"
authors = ["abeyuhang@gmail.com"]
edition = "2021"
license = "MIT"
repository = "https://github.com/YuhangGe/CloudTun"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cloudtun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cloudtun-common = { path = "../src-common", features = ["tencent", "ping"] }
log = "0.4.35"
tauri = { version = "2.12.7", features = ["tray-icon", "devtools", "image-png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
anyhow-tauri = "1.0.1"
base64 = "0.23.1"
sha2 = "0.11.1"
chrono = "0.4.45"
rand = "0.9"
hmac = "0.13.0"
uuid = { version = "1.29.3", features = ["v4"] }
tauri-plugin-http = { version = "2.9.0", features = ["unsafe-headers"] }
tauri-plugin-store = "2.5.1"
tauri-plugin-os = "2.4.0"
tokio = { version = "1.54.1", features = ["macros"] }
tokio-util = { version = "0.7.20" }
env_logger = "0.11.11"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
cloudtun-proxy = { path = "../src-proxy" }
axum = "0.8.9"
if-addrs = "0.15.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-clipboard-manager = "2.5.0"

# [target.'cfg(target_os = "android")'.dependencies]
# cloudtun-vpn = { path = "../src-vpn" }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-ios = { path = "../tauri-plugin-ios" }
oslog = "0.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSCell", "NSText"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
sysproxy = "0.3.0"
